font_size 13

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

disable_ligatures no
enable_audio_bell no
shell zsh
shell_integration disabled

# Scrollback: barra visible y arrastrable
scrollbar always
scrollbar_width 0.6
scrollbar_handle_opacity 0.65
scrollbar_track_opacity 0.10
scrollbar_track_hover_opacity 0.18
scrollbar_radius 0.4
scrollbar_hover_width 1.8
scrollbar_hitbox_expansion 0.35

# Cursor de barra con estela "cortante" al desplazarse
cursor_shape beam
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.06 0.28
cursor_trail_start_threshold 1

url_style curly
remember_window_size no
initial_window_width 640
initial_window_height 480
window_padding_width 20
background_opacity 0.82
confirm_os_window_close 0
sync_to_monitor no

# Colores del tema activo (generado por ~/.config/theme-switcher)
include theme.conf
